name: Buyuk Av Tarayici

# Her gun 03:30 (TR) = 00:30 UTC: BIST, ABD ve kripto gunluk mumlari kapanmis olur.
# Rapor Telegram'a gider: yeni sinyaller, stop guncellemeleri, cikislar, kagit portfoy.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      backtest:
        description: "true yaparsan 2005+ portfoy testini calistirir (Telegram yok)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: buyuk-av
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Backtest
        if: ${{ github.event.inputs.backtest == 'true' }}
        run: python buyuk_av.py --backtest

      - name: Gunluk tarama + Telegram
        if: ${{ github.event.inputs.backtest != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python buyuk_av.py
