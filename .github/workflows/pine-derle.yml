name: Pine derleme (gecici)
on:
  push:
    branches: [arastirma]
    paths: ["pine/**", ".github/workflows/pine-derle.yml"]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p arastirma_cikti; : > arastirma_cikti/derleme.txt
          for f in pine/*.pine; do
            code=$(curl -s -m 60 -o /tmp/o -w "%{http_code}" -X POST "https://pine-facade.tradingview.com/pine-facade/translate_light?user_name=Guest&pine_id=00000000-0000-0000-0000-000000000000" -H "Referer: https://www.tradingview.com/" -H "Origin: https://www.tradingview.com" --data-urlencode "source@$f")
            echo "== $f $code" >> arastirma_cikti/derleme.txt
            python3 pine/derle.py >> arastirma_cikti/derleme.txt
          done
          cat arastirma_cikti/derleme.txt
          git config user.name a; git config user.email a@users.noreply.github.com
          git add arastirma_cikti/derleme.txt; git commit -m "derleme [skip ci]"; git pull --rebase origin arastirma; git push
