name: SUSHI Izleme Botu

on:
  schedule:
    # Her 15 dakikada bir calisir (GitHub'in sunucu saatine gore, UTC).
    # Not: GitHub Actions'ta zamanlanmis gorevler yogunlukta birkac dakika
    # gecikebilir, bu strateji icin (4 saatlik mumlar) sorun degil.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_mesaji:
        description: "true yaparsan gercek sinyal beklemeden Telegram'a bir test mesaji gonderir"
        type: boolean
        default: false

permissions:
  contents: write   # durum dosyasini (state) repoya geri commit edebilmek icin gerekli

jobs:
  izle:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutuphaneleri kur
        run: pip install pandas numpy requests

      - name: Scripti calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ github.event.inputs.test_mesaji }}
        run: python sushi_izleme_bulut.py

      - name: Durumu repoya geri kaydet (degistiyse)
        run: |
          git config user.name "sushi-bot"
          git config user.email "sushi-bot@users.noreply.github.com"
          git add sushi_izleme_state.json
          git diff --quiet --cached || git commit -m "durum guncellendi [skip ci]"
          git push || true
