name: v6 Dogrulama (gecici)

on:
  push:
    branches: [v6-dogrulama]
    paths-ignore: ["dogrulama_cikti/**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dogrula:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .veri_cache
          key: dogrulama-${{ github.run_id }}
          restore-keys: dogrulama-
      - name: Bot kuru calistirma (Telegram'siz) x2
        run: |
          mkdir -p dogrulama_cikti
          ( time python genel_izleme_bulut.py ) > dogrulama_cikti/bot1.txt 2>&1
          ( time OZET_ZORLA=true python genel_izleme_bulut.py ) > dogrulama_cikti/bot2.txt 2>&1
          cp izleme_state.json dogrulama_cikti/state_sonra.json
          git checkout izleme_state.json
      - run: |
          git config user.name "dogrulama"; git config user.email "d@users.noreply.github.com"
          git add dogrulama_cikti; git commit -m "dogrulama cikti [skip ci]" && git push || true
