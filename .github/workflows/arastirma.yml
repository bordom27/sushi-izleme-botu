name: Arastirma (gecici)

on:
  push:
    branches: [arastirma]
    paths-ignore: ["arastirma_cikti/**", "pine/**", ".github/workflows/pine-derle.yml", ".github/workflows/erisim-testi.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        mod: [gozden-0, gozden-1, gozden-2, gozden-3, gozden-4, gozden-5, gozden-6, gozden-7, gozden-8, gozden-9, gozden-10, gozden-11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt scikit-learn
      - uses: actions/cache@v4
        with:
          path: .veri_cache
          key: arastirma-${{ matrix.mod }}-${{ github.run_id }}
          restore-keys: |
            arastirma-uzun-
            arastirma-${{ matrix.mod }}-
            arastirma-kombo-
            arastirma-formasyon-
            arastirma-ozellik-
            arastirma-kovalama-
            arastirma-limit-
            arastirma-profesyonel-
      - run: python $( case "${{ matrix.mod }}" in ozellik) echo ozellik.py;; dogruluk) echo dogruluk.py;; *) echo "arastirma.py ${{ matrix.mod }}";; esac ) 2>&1 | grep -v " mum (" | tee log_${{ matrix.mod }}.txt
      - run: |
          mkdir -p arastirma_cikti && mv log_${{ matrix.mod }}.txt arastirma_cikti/
          git config user.name "arastirma"; git config user.email "a@users.noreply.github.com"
          git add arastirma_cikti
          git commit -m "arastirma ${{ matrix.mod }} [skip ci]" || exit 0
          for i in $(seq 1 25); do git pull --rebase origin arastirma && git push && break; sleep $((RANDOM % 20 + 3)); done
