name: Erisim testi (gecici)
on:
  push:
    branches: [arastirma]
    paths: [".github/workflows/erisim-testi.yml"]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p arastirma_cikti
          for u in \
            "https://fapi.binance.com/futures/data/topLongShortPositionRatio?symbol=BTCUSDT&period=4h&limit=2" \
            "https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=BTCUSDT&period=4h&limit=2" \
            "https://www.binance.com/futures/data/topLongShortPositionRatio?symbol=BTCUSDT&period=4h&limit=2" \
            "https://api.bybit.com/v5/market/account-ratio?category=linear&symbol=BTCUSDT&period=4h&limit=2" \
            "https://www.okx.com/api/v5/rubik/stat/contracts/long-short-account-ratio?ccy=BTC&period=4H" \
            "https://data.binance.vision/data/futures/um/daily/metrics/BTCUSDT/BTCUSDT-metrics-$(date -u -d '1 day ago' +%F).zip" ; do
            code=$(curl -s -m 15 -o /tmp/o -w "%{http_code}" "$u"); echo "$code $(head -c 160 /tmp/o | tr -d '\n') :: $u" >> arastirma_cikti/erisim.txt
          done
          cat arastirma_cikti/erisim.txt
          git config user.name a; git config user.email a@users.noreply.github.com
          git add arastirma_cikti/erisim.txt; git commit -m "erisim [skip ci]"; git pull --rebase origin arastirma; git push
