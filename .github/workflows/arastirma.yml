name: Arastirma (gecici)

on:
  push:
    branches: [arastirma]
    paths-ignore: ["arastirma_cikti/**", "pine/**", ".github/workflows/pine-derle.yml", ".github/workflows/erisim-testi.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        mod: [dakika]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt scikit-learn
      - uses: actions/cache@v4
        with:
          path: .veri_cache
          key: arastirma-${{ matrix.mod }}-${{ github.run_id }}
          restore-keys: |
            arastirma-uzun-
            arastirma-${{ matrix.mod }}-
            arastirma-kombo-
            arastirma-formasyon-
            arastirma-ozellik-
            arastirma-kovalama-
            arastirma-limit-
            arastirma-profesyonel-
      - env:
          NODEREAL_KEY: ${{ secrets.NODEREAL_KEY }}
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}
          ES_ARALIK: "0.5"
        run: python $( case "${{ matrix.mod }}" in ozellik) echo ozellik.py;; vadeli) echo vadeli_liste.py;; bak-*) mkdir -p main_kod; for f in veri.py short_retest.py; do git fetch -q origin main; git show origin/main:$f > main_kod/$f; done; echo coin_bak.py $(echo ${{ matrix.mod }} | sed s/^bak-//);; durum) mkdir -p main_kod; for f in veri.py kirilim_v6.py coin_listesi.py short_retest.py; do git fetch -q origin main; git show origin/main:$f > main_kod/$f; done; echo durum.py;; buyuk-*) echo buyuk.py $(echo ${{ matrix.mod }} | sed s/^buyuk-//);; duyuru) echo duyuru/cek.py;; dakika) echo duyuru/dakika.py;; zincirtoplu) echo zincir/toplu.py;; zincirolay) echo zincir/olay_tarama.py;; k69z-*) echo zincir/transfer_test.py $(echo ${{ matrix.mod }} | sed 's/^k69z-//; s/-/ /g') k69;; tt-*) echo zincir/transfer_test.py $(echo ${{ matrix.mod }} | sed 's/^tt-//; s/-/ /g');; ak-*) echo zincir/akilli.py $(echo ${{ matrix.mod }} | sed 's/^ak-//; s/-/ /g');; zincir-*) echo zincir/vaka.py $(echo ${{ matrix.mod }} | sed 's/^zincir-//; s/-/ /g');; dok1h-*) echo veri_dok.py $(echo ${{ matrix.mod }} | sed s/^dok1h-//) 20 1h;; dok-*) echo veri_dok.py $(echo ${{ matrix.mod }} | sed s/^dok-//) 10;; retest-*) echo retest_test.py $(echo ${{ matrix.mod }} | sed s/^retest-//);; dogruluk) echo dogruluk.py;; *) echo "arastirma.py ${{ matrix.mod }}";; esac ) 2>&1 | grep -v " mum (" | tee log_${{ matrix.mod }}.txt
      - run: |
          mkdir -p arastirma_cikti && mv log_${{ matrix.mod }}.txt arastirma_cikti/
          git config user.name "arastirma"; git config user.email "a@users.noreply.github.com"
          git add arastirma_cikti
          git commit -m "arastirma ${{ matrix.mod }} [skip ci]" || exit 0
          for i in $(seq 1 25); do git pull --rebase origin arastirma && git push && break; sleep $((RANDOM % 20 + 3)); done
