name: Genel Izleme Botu

# GitHub'in saatlik zamanlamasi yogunlukta atlaniyor (Ekim 2026: 4-5 saatte bir calisti).
# Bu yuzden her calistirma ~5.5 saat boyunca botu her saatin 7. dakikasinda kendisi calistirir,
# bitince bir sonraki calistirmayi baslatir (zincir). Saatlik zamanlama yedek olarak kalir:
# zincir bir sekilde koparsa ilk zamanlanmis calistirma zinciri yeniden baslatir.
# concurrency: ayni anda tek calistirma + en fazla bir bekleyen, bu yuzden zincir cogalmaz.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test_mesaji:
        description: "true yaparsan taramayi atlar, sadece Telegram test mesaji gonderir"
        type: boolean
        default: false
      ozet_gonder:
        description: "true yaparsan gunluk ozeti hemen de gonderir"
        type: boolean
        default: false
      tek_tur:
        description: "true yaparsan bir kez calisir, dongu/zincir yok"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: izleme-botu
  cancel-in-progress: false

jobs:
  izle:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Mum verisi onbellegi
        uses: actions/cache@v4
        with:
          path: .veri_cache
          key: mumlar-${{ github.run_id }}
          restore-keys: mumlar-

      - name: Botu calistir (saatlik dongu)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ github.event.inputs.test_mesaji }}
          OZET_ZORLA: ${{ github.event.inputs.ozet_gonder }}
          TEK_TUR: ${{ github.event.inputs.tek_tur }}
        run: |
          git config user.name "izleme-bot"
          git config user.email "izleme-bot@users.noreply.github.com"
          BITIS=$(( $(date +%s) + 5*3600 + 25*60 ))
          tur=0
          while :; do
            tur=$((tur + 1))
            echo "::group::Tur $tur ($(date -u +%H:%M) UTC)"
            git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            pip install -q -r requirements.txt || true
            python genel_izleme_bulut.py || echo "bot hata verdi (tur $tur), sonraki turda tekrar denenecek"
            git add izleme_state.json
            if ! git diff --quiet --cached; then
              git commit -q -m "durum guncellendi [skip ci]"
              for i in 1 2 3; do
                git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q && break
                sleep 5
              done
            fi
            echo "::endgroup::"
            if [ "$TEST_MODE" = "true" ] || [ "$TEK_TUR" = "true" ]; then break; fi
            unset OZET_ZORLA                      # ozet zorlamasi yalnizca ilk turda
            simdi=$(date +%s)
            sonraki=$(( simdi / 3600 * 3600 + 7 * 60 ))          # bu saatin 7. dakikasi
            if [ "$sonraki" -le "$simdi" ]; then sonraki=$(( sonraki + 3600 )); fi
            if [ "$sonraki" -gt "$BITIS" ]; then break; fi
            sleep $(( sonraki - simdi ))
          done

      - name: Zinciri devam ettir
        if: ${{ !cancelled() && github.event.inputs.test_mesaji != 'true' && github.event.inputs.tek_tur != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run genel-izleme-workflow.yml --ref "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}"
