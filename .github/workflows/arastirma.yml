name: Arastirma (gecici)

on:
  push:
    branches: [arastirma]
    paths-ignore: ["arastirma_cikti/**", "pine/**", ".github/workflows/pine-derle.yml", ".github/workflows/erisim-testi.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mod: [limit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .veri_cache
          key: arastirma-${{ matrix.mod }}-${{ github.run_id }}
          restore-keys: |
            arastirma-${{ matrix.mod }}-
            arastirma-kombo-
            arastirma-formasyon-
            arastirma-ozellik-
            arastirma-kovalama-
      - run: python $( [ "${{ matrix.mod }}" = ozellik ] && echo ozellik.py || echo "arastirma.py ${{ matrix.mod }}" ) 2>&1 | grep -v " mum (" | tee log_${{ matrix.mod }}.txt
      - run: |
          mkdir -p arastirma_cikti && mv log_${{ matrix.mod }}.txt arastirma_cikti/
          git config user.name "arastirma"; git config user.email "a@users.noreply.github.com"
          git add arastirma_cikti
          git commit -m "arastirma ${{ matrix.mod }} [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin arastirma && git push && break; sleep $((RANDOM % 10 + 3)); done
