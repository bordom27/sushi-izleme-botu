name: Aylik Yeniden Dogrulama

on:
  schedule:
    - cron: "0 6 1 * *"   # her ayin 1'i 09:00 (TR)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  yeniden-dogrula:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: v6 backtest (botla ayni kod) + Telegram raporu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python v6_backtest.py --telegram

      - name: Sonuc CSV'sini repoya geri kaydet
        run: |
          git config user.name "izleme-bot"
          git config user.email "izleme-bot@users.noreply.github.com"
          git add v6_backtest_sonuclari.csv
          if ! git diff --quiet --cached; then
            git commit -m "aylik v6 dogrulama sonucu [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              sleep 5
            done
          fi
