name: Genel Izleme Botu

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      test_mesaji:
        description: "true yaparsan taramayi atlar, sadece Telegram test mesaji gonderir"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  izle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutuphaneleri kur
        run: pip install pandas numpy requests

      - name: Scripti calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ github.event.inputs.test_mesaji }}
        run: python genel_izleme_bulut.py

      - name: Durumu repoya geri kaydet (degistiyse)
        run: |
          git config user.name "izleme-bot"
          git config user.email "izleme-bot@users.noreply.github.com"
          git add izleme_state.json
          git diff --quiet --cached || git commit -m "durum guncellendi [skip ci]"
          git push || true
