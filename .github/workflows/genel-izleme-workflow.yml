name: Genel Izleme Botu

on:
  schedule:
    - cron: "7 * * * *"   # saatte bir; 4 saatlik mumlar 03/07/11/15/19/23 (TR) kapanir, gecikme olsa da bot telafi eder
  workflow_dispatch:
    inputs:
      test_mesaji:
        description: "true yaparsan taramayi atlar, sadece Telegram test mesaji gonderir"
        type: boolean
        default: false
      ozet_gonder:
        description: "true yaparsan gunluk ozeti hemen de gonderir"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: izleme-botu
  cancel-in-progress: false

jobs:
  izle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Mum verisi onbellegi
        uses: actions/cache@v4
        with:
          path: .veri_cache
          key: mumlar-${{ github.run_id }}
          restore-keys: mumlar-

      - name: Scripti calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ github.event.inputs.test_mesaji }}
          OZET_ZORLA: ${{ github.event.inputs.ozet_gonder }}
        run: python genel_izleme_bulut.py

      - name: Durumu repoya geri kaydet (degistiyse)
        run: |
          git config user.name "izleme-bot"
          git config user.email "izleme-bot@users.noreply.github.com"
          git add izleme_state.json
          if ! git diff --quiet --cached; then
            git commit -m "durum guncellendi [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
              sleep 5
            done
          fi
