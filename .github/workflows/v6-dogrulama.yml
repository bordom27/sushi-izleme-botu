name: v6 Dogrulama (gecici)

on:
  push:
    branches: [v6-dogrulama]
  workflow_dispatch: {}

jobs:
  dogrula:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - run: python v6_backtest.py --dogrulama
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogrulama
          path: v6_dogrulama_oos.csv
